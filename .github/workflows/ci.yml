name: CommunityHub checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install
      - run: pnpm exec prettier --check .
      - run: pnpm exec tsc -p packages/shared/tsconfig.json --pretty false
      - run: pnpm test
      - run: pnpm release:check
