name: Release SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: communityhub-sbom.cdx.json
          artifact-name: communityhub-sbom
          upload-artifact: true
          upload-release-assets: true
